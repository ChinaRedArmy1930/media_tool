ffmpeg-next = "8.0.0"
libc = "0.2.176"
log = "0.4.28"
reqwest = { version = "0.12.23", features = ["stream"] }
tokio = { version = "1.47.1", features = ["full"] }
indicatif = "0.18.0"
futures-util = "0.3.31"
