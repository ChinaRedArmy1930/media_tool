[package]
name = "ffmpeg_split_audit"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.18.1", features = ["v4"] }
anyhow = "1.0.100"
clap = { version = "4.5.45", features = ["derive"] }
clap_derive = { version = "4.0.0-rc.1" }
